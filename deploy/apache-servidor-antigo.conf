# Servidor antigo 10.81.11.202 (Apache 2.4): a ARS mudou para http://172.31.20.60/ars.
# Vai para /etc/apache2/conf-available/ars-redirect.conf (a2enconf ars-redirect), como o
# peticaofacil2-redirect.conf do Peticao Facil. Codigo e banco antigos ficam intactos.
# O mod_alias trata os Redirect antes do .htaccess e dos Alias; vale a primeira regra que casar.
# A query string original segue junto.

# Favoritos com os nomes do PHP puro (o .htaccess antigo fazia essa troca).
RedirectMatch 301 "^/ars/(login|index|admin|painel|producao|relatorio|carteiras|clientes|andamentos|metas|semanas|regioes)\.php$" "http://172.31.20.60/ars/$1"
RedirectMatch 301 "^/ars/usu\.php$" "http://172.31.20.60/ars/usuarios"
RedirectMatch 301 "^/ars/setor\.php$" "http://172.31.20.60/ars/setores"
RedirectMatch 301 "^/ars/dados_anda\.php$" "http://172.31.20.60/ars/detalhes/andamentos"
RedirectMatch 301 "^/ars/dados_fatur\.php$" "http://172.31.20.60/ars/detalhes/faturamento"

# Qualquer outro endereco: mesmo caminho no servidor novo.
RedirectMatch 301 "^/ars(?:/(.*))?$" "http://172.31.20.60/ars/$1"
