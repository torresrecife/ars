# HTTPS do EUROPA-HD (172.31.20.60) com o certificado da CA interna do BVAA.
# Instalado em /etc/nginx/snippets/peticaofacil-extra/00-https.conf: esse diretorio e incluido
# DENTRO do server block do Peticao Facil, entao a porta 443 atende o site inteiro
# (Peticao Facil na raiz, /bvtarefas, /bvacesso e /ars), com as mesmas regras da porta 80.
# Desfazer: apagar o arquivo e "sudo nginx -t && sudo systemctl reload nginx".
# Roteiro em deploy/https/README.md (repositorio da ARS).

listen 443 ssl;
listen [::]:443 ssl;
http2 on;

ssl_certificate     /etc/ssl/bvaa/europa-hd.crt;
ssl_certificate_key /etc/ssl/bvaa/private/europa-hd.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:BVAA_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

