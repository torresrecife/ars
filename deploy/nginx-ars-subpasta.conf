# ARS em http://172.31.20.60/ars, dentro do site do Peticao Facil (porta 80),
# como o BVTarefas e o BVAcesso: a rede da empresa so libera a porta 80 ate os servidores.
# Instalado em /etc/nginx/snippets/peticaofacil-extra/ars.conf, incluido pelo
# server block do Peticao Facil (ver deploy/README.md).
# .env: APP_URL=http://172.31.20.60/ars, ASSET_URL=/ars, SESSION_PATH=/ars.

location = /ars {
    return 301 /ars/;
}

# ^~ : nenhuma regex do Peticao Facil (PHP, caminhos antigos) atende /ars/.
location ^~ /ars/ {
    alias /var/www/ars/public/;
    try_files $uri $uri/ @ars;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # build/: nomes com hash, mudam a cada versao.
    location ^~ /ars/build/ {
        expires 7d;
        access_log off;
    }

    location = /ars/index.php {
        include fastcgi_params;
        # SCRIPT_NAME (/ars/index.php) vem do fastcgi_params: e por ele que o Laravel
        # descobre o prefixo /ars e gera todas as URLs com ele.
        fastcgi_param SCRIPT_FILENAME /var/www/ars/public/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    # Nenhum outro .php do sistema e executado.
    location ~ \.php$ {
        return 404;
    }
}

# Rotas do Laravel: tudo o que nao e arquivo vai para o index.php (a query string original segue junto).
location @ars {
    rewrite ^ /ars/index.php last;
}
